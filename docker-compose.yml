services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: datasentry-server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/datasentry.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      - datasentry-data:/app/data
      - datasentry-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: datasentry-client
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datasentry-data:
  datasentry-uploads:
